spring:
  application:
    name: esports-hub-backend

  # --- DEV baza: H2 in-memory (radi bez Dockera, PostgreSQL kompatibilan mod) ---
  datasource:
    url: jdbc:h2:mem:esportshub;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: none          # shemu vodi Liquibase, ne Hibernate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

server:
  port: 8080

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
