spring:
  application:
    name: esports-hub-backend

  # --- Glavna (dev) baza: PostgreSQL iz Dockera ---
  datasource:
    url: jdbc:postgresql://localhost:5433/esportshub
    username: esportshub
    password: esportshub
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none          # shemu vodi Liquibase
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

server:
  port: 8080

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
