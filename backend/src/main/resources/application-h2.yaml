# Rezervni profil: pokreni sa  --spring.profiles.active=h2
# kada NE zelis Docker/Postgres (in-memory baza, nestaje pri gasenju).
spring:
  datasource:
    url: jdbc:h2:mem:esportshub;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
