databaseChangeLog:

  - changeSet:
      id: 031-add-organizer-role
      author: dino
      changes:
        - insert: { tableName: roles, columns: [ { column: { name: name, value: ORGANIZER } } ] }
        - sql:
            sql: >
              INSERT INTO user_roles (user_id, role_id)
              SELECT DISTINCT t.organizer_id, r.id
              FROM tournaments t
              JOIN roles r ON r.name = 'ORGANIZER'
              WHERE NOT EXISTS (
                SELECT 1 FROM user_roles ur WHERE ur.user_id = t.organizer_id AND ur.role_id = r.id
              )

  - changeSet:
      id: 032-drop-spectator-captain-roles
      author: dino
      changes:
        - sql:
            sql: >
              DELETE FROM user_roles
              WHERE role_id IN (SELECT id FROM roles WHERE name IN ('SPECTATOR', 'CAPTAIN'))
        - delete:
            tableName: roles
            where: name IN ('SPECTATOR', 'CAPTAIN')
