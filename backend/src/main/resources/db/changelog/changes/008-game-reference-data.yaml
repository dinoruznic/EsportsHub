databaseChangeLog:

  - changeSet:
      id: 022-add-game-rank-type
      author: dino
      changes:
        - addColumn:
            tableName: games
            columns:
              - column: { name: rank_type, type: VARCHAR(10), defaultValue: NONE, constraints: { nullable: false } }

  - changeSet:
      id: 023-create-game-regions
      author: dino
      changes:
        - createTable:
            tableName: game_regions
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: game_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: code, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: label, type: VARCHAR(40), constraints: { nullable: false } }
        - addForeignKeyConstraint: { baseTableName: game_regions, baseColumnNames: game_id, referencedTableName: games, referencedColumnNames: id, constraintName: fk_game_regions_game }
        - addUniqueConstraint: { tableName: game_regions, columnNames: "game_id, code", constraintName: uq_game_regions_game_code }

  - changeSet:
      id: 024-create-game-positions
      author: dino
      changes:
        - createTable:
            tableName: game_positions
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: game_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: code, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: label, type: VARCHAR(40), constraints: { nullable: false } }
        - addForeignKeyConstraint: { baseTableName: game_positions, baseColumnNames: game_id, referencedTableName: games, referencedColumnNames: id, constraintName: fk_game_positions_game }
        - addUniqueConstraint: { tableName: game_positions, columnNames: "game_id, code", constraintName: uq_game_positions_game_code }

  - changeSet:
      id: 025-create-game-ranks
      author: dino
      changes:
        - createTable:
            tableName: game_ranks
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: game_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: code, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: label, type: VARCHAR(40), constraints: { nullable: false } }
              - column: { name: ordinal, type: INT }
        - addForeignKeyConstraint: { baseTableName: game_ranks, baseColumnNames: game_id, referencedTableName: games, referencedColumnNames: id, constraintName: fk_game_ranks_game }
        - addUniqueConstraint: { tableName: game_ranks, columnNames: "game_id, code", constraintName: uq_game_ranks_game_code }

  - changeSet:
      id: 026-seed-game-rank-type
      author: dino
      changes:
        - update: { tableName: games, columns: [ { column: { name: rank_type, value: TIER } } ], where: "code='LOL'" }
        - update: { tableName: games, columns: [ { column: { name: rank_type, value: TIER } } ], where: "code='VALORANT'" }
        - update: { tableName: games, columns: [ { column: { name: rank_type, value: NUMERIC } } ], where: "code='CS2'" }
        - update: { tableName: games, columns: [ { column: { name: rank_type, value: NUMERIC } } ], where: "code='DOTA2'" }

  - changeSet:
      id: 027-seed-game-reference-data
      author: dino
