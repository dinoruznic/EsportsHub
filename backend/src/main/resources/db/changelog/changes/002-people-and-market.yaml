databaseChangeLog:

  # ---- player_profiles (1:1 users) ----
  - changeSet:
      id: 005-create-player-profiles
      author: dino
      changes:
        - createTable:
            tableName: player_profiles
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false, unique: true } }
              - column: { name: riot_id, type: VARCHAR(40) }
              - column: { name: summoner_puuid, type: VARCHAR(78) }
              - column: { name: region, type: VARCHAR(6) }
              - column: { name: rank_tier, type: VARCHAR(12) }
              - column: { name: main_position, type: VARCHAR(8) }
              - column: { name: market_status, type: VARCHAR(12), defaultValue: INACTIVE, constraints: { nullable: false } }
              - column: { name: bio, type: TEXT }
        - addForeignKeyConstraint:
            baseTableName: player_profiles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_player_profiles_user
            onDelete: CASCADE

  # ---- teams ----
  - changeSet:
      id: 006-create-teams
      author: dino
      changes:
        - createTable:
            tableName: teams
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: VARCHAR(60), constraints: { nullable: false, unique: true } }
              - column: { name: tag, type: VARCHAR(5), constraints: { nullable: false, unique: true } }
              - column: { name: logo_url, type: VARCHAR(255) }
              - column: { name: region, type: VARCHAR(6) }
              - column: { name: captain_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: budget, type: INT, defaultValueNumeric: 0 }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: teams
            baseColumnNames: captain_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_teams_captain

  # ---- team_memberships (M:N player <-> team) ----
  - changeSet:
      id: 007-create-team-memberships
      author: dino
      changes:
        - createTable:
            tableName: team_memberships
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: team_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: player_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: role_in_team, type: VARCHAR(10) }
              - column: { name: position, type: VARCHAR(8) }
              - column: { name: active, type: BOOLEAN, defaultValueBoolean: true }
              - column: { name: joined_at, type: TIMESTAMP }
              - column: { name: left_at, type: TIMESTAMP }
        - addForeignKeyConstraint:
            baseTableName: team_memberships
            baseColumnNames: team_id
            referencedTableName: teams
            referencedColumnNames: id
            constraintName: fk_membership_team
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: team_memberships
            baseColumnNames: player_id
            referencedTableName: player_profiles
            referencedColumnNames: id
            constraintName: fk_membership_player
            onDelete: CASCADE

  # ---- transfer_listings ----
  - changeSet:
      id: 008-create-transfer-listings
      author: dino
      changes:
        - createTable:
            tableName: transfer_listings
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: player_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: asking_price, type: INT }
              - column: { name: status, type: VARCHAR(10), constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP }
              - column: { name: closed_at, type: TIMESTAMP }
        - addForeignKeyConstraint:
            baseTableName: transfer_listings
            baseColumnNames: player_id
            referencedTableName: player_profiles
            referencedColumnNames: id
            constraintName: fk_listing_player
            onDelete: CASCADE

  # ---- transfer_offers ----
  - changeSet:
      id: 009-create-transfer-offers
      author: dino
      changes:
        - createTable:
            tableName: transfer_offers
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: listing_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: from_team_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: amount, type: INT }
              - column: { name: message, type: VARCHAR(255) }
              - column: { name: status, type: VARCHAR(10), constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP }
              - column: { name: responded_at, type: TIMESTAMP }
        - addForeignKeyConstraint:
            baseTableName: transfer_offers
            baseColumnNames: listing_id
            referencedTableName: transfer_listings
            referencedColumnNames: id
            constraintName: fk_offer_listing
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: transfer_offers
            baseColumnNames: from_team_id
            referencedTableName: teams
            referencedColumnNames: id
            constraintName: fk_offer_team

  # ---- contracts ----
  - changeSet:
      id: 010-create-contracts
      author: dino
      changes:
        - createTable:
            tableName: contracts
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: player_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: team_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: salary, type: INT }
              - column: { name: start_date, type: DATE }
              - column: { name: end_date, type: DATE }
              - column: { name: status, type: VARCHAR(12), constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP }
        - addForeignKeyConstraint:
            baseTableName: contracts
            baseColumnNames: player_id
            referencedTableName: player_profiles
            referencedColumnNames: id
            constraintName: fk_contract_player
        - addForeignKeyConstraint:
            baseTableName: contracts
            baseColumnNames: team_id
            referencedTableName: teams
            referencedColumnNames: id
            constraintName: fk_contract_team
