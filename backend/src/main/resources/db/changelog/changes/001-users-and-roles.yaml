databaseChangeLog:

  - changeSet:
      id: 001-create-roles
      author: dino
      changes:
        - createTable:
            tableName: roles
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: VARCHAR(20), constraints: { nullable: false, unique: true } }

  - changeSet:
      id: 002-create-users
      author: dino
      changes:
        - createTable:
            tableName: users
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: username, type: VARCHAR(30), constraints: { nullable: false, unique: true } }
              - column: { name: email, type: VARCHAR(120), constraints: { nullable: false, unique: true } }
              - column: { name: password_hash, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: display_name, type: VARCHAR(60) }
              - column: { name: avatar_url, type: VARCHAR(255) }
              - column: { name: country, type: VARCHAR(2) }
              - column: { name: bio, type: TEXT }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }

  - changeSet:
      id: 003-create-user-roles
      author: dino
      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: role_id, type: BIGINT, constraints: { nullable: false } }
        - addPrimaryKey: { tableName: user_roles, columnNames: user_id, role_id, constraintName: pk_user_roles }
        - addForeignKeyConstraint: { baseTableName: user_roles, baseColumnNames: user_id, referencedTableName: users, referencedColumnNames: id, constraintName: fk_user_roles_user, onDelete: CASCADE }
        - addForeignKeyConstraint: { baseTableName: user_roles, baseColumnNames: role_id, referencedTableName: roles, referencedColumnNames: id, constraintName: fk_user_roles_role, onDelete: CASCADE }

  - changeSet:
      id: 004-seed-roles
      author: dino
      changes:
        - insert: { tableName: roles, columns: [ { column: { name: name, value: SPECTATOR } } ] }
        - insert: { tableName: roles, columns: [ { column: { name: name, value: PLAYER } } ] }
        - insert: { tableName: roles, columns: [ { column: { name: name, value: CAPTAIN } } ] }
        - insert: { tableName: roles, columns: [ { column: { name: name, value: REFEREE } } ] }
        - insert: { tableName: roles, columns: [ { column: { name: name, value: ADMIN } } ] }
