<app-landing-background [images]="images" />

<main class="page">
  <div class="view hero-view" [class.hidden]="mode()" [attr.inert]="mode() ? '' : null">
    <header class="hero">
      <p class="eyebrow">Turniri · Timovi · Transfer market · Uživo</p>
      <h1 class="wordmark">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <path class="hex" d="M16 2.5 27.7 9.25v13.5L16 29.5 4.3 22.75V9.25Z" />
          <path class="hex-inner" d="M16 9.5 21.6 12.75v6.5L16 22.5l-5.6-3.25v-6.5Z" />
        </svg>
        ESPORTSHUB
      </h1>
      <p class="lead">Platforma za amaterske esports turnire, od prijave tima do finala uživo.</p>
    </header>

    <div class="actions">
      <button #loginButton type="button" class="btn btn-gold" (click)="open('prijava')">
        Prijava
      </button>
      <button #registerButton type="button" class="btn btn-ghost" (click)="open('registracija')">
        Registracija
      </button>
    </div>
  </div>

  <div class="view form-view" [class.hidden]="!mode()" [attr.inert]="mode() ? null : ''">
    <button type="button" class="back" aria-label="Nazad na početnu" (click)="back()">← Nazad</button>

    <section
      id="auth-card"
      class="card panel"
      [attr.aria-label]="cardMode() === 'registracija' ? 'Registracija' : 'Prijava'"
    >
      <div
        class="card-frame"
        [class.switching]="switching()"
        [style.height.px]="switching() ? cardHeight() : null"
      >
        <div #cardBody class="card-body">
          @if (cardMode() === 'prijava') {
            <app-login-form animate.leave="leaving" (switchForm)="open('registracija')" />
          } @else if (cardMode() === 'registracija') {
            <app-register-form animate.leave="leaving" (switchForm)="open('prijava')" />
          }
        </div>
      </div>
    </section>
  </div>
</main>
