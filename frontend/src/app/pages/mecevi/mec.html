<div class="topline">
  @if (tournament(); as t) {
    <a class="back" [routerLink]="['/turniri', t.id]">← {{ t.name }}</a>
  } @else {
    <a class="back" routerLink="/turniri">← Turniri</a>
  }
  <app-connection-indicator [state]="realtime.state()" />
</div>

@if (loadError(); as message) {
  <app-error-state [message]="message" (retry)="retry()" />
} @else if (!match()) {
  <app-skeleton [count]="1" [height]="260" />
} @else {
  @let m = match()!;
  <div class="heading">
    <p class="eyebrow">{{ eyebrow() }}</p>
    <span class="match-chip" [attr.data-status]="m.status">
      @if (live()) {
        <span class="live-dot" aria-hidden="true"></span>
      }
      {{ statusLabel() }}
    </span>
  </div>

  <h1 class="sr-only">{{ m.teamA?.name ?? 'Čeka se' }} vs {{ m.teamB?.name ?? 'Čeka se' }}</h1>

  <app-match-scoreboard [match]="m" [clock]="clock()" [statusLabel]="statusLabel()" />

  <div class="lower">
    <app-match-stats [snapshot]="snapshot()" />
    <app-match-feed [entries]="feed()" />
  </div>
}
