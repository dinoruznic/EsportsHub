<div class="shell">
  <nav class="rail" aria-label="Glavna navigacija">
    <a class="logo" routerLink="/turniri" aria-label="EsportsHub početna">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path class="hex" d="M16 2.5 27.7 9.25v13.5L16 29.5 4.3 22.75V9.25Z" />
        <path class="hex-inner" d="M16 9.5 21.6 12.75v6.5L16 22.5l-5.6-3.25v-6.5Z" />
      </svg>
    </a>
    <ul class="nav">
      @for (item of nav; track item.path) {
        <li>
          <a
            class="nav-item"
            [routerLink]="item.path"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              @for (d of item.icon; track $index) {
                <path [attr.d]="d" />
              }
            </svg>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="main">
    <header class="topbar">
      <div class="topbar-inner">
        <span aria-hidden="true"></span>
        <a class="wordmark" routerLink="/turniri">EsportsHub</a>
        @if (user(); as user) {
          <div class="account">
            <span class="username">{{ user.username }}</span>
            <ul class="roles" aria-label="Uloge">
              @for (role of user.roles; track role) {
                <li class="role">{{ role }}</li>
              }
            </ul>
            <button type="button" class="btn btn-ghost" (click)="logout()">Odjava</button>
          </div>
        }
      </div>
    </header>
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
